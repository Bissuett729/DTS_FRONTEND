<!-- Overlay -->
<div 
  class="fixed inset-0 bg-black/50 z-115 transition-opacity duration-300"
  [class.opacity-0]="!isVisible()"
  [class.opacity-100]="isVisible()"
  (click)="close()">
</div>

<!-- Sidebar -->
<div 
  class="fixed right-0 top-0 h-full w-full sm:w-96 md:w-105 bg-[#003d65] shadow-2xl z-120 flex flex-col transition-transform duration-300 ease-out"
  [class.translate-x-full]="!isVisible()"
  [class.translate-x-0]="isVisible()">
  
  <!-- Header -->
  <div class="flex items-center justify-between px-4 sm:px-6 py-4 border-b border-[#00243f] shrink-0">
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <i class="ri-code-s-slash-line text-xl sm:text-2xl text-white shrink-0"></i>
      <div class="min-w-0">
        <h2 class="text-white font-bold text-base sm:text-lg truncate">Request Support</h2>
        <p class="text-gray-400 text-[10px] sm:text-xs truncate">Report an issue or request a feature</p>
      </div>
    </div>
    <button 
      class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-lg hover:bg-white/10 active:bg-white/20 text-white transition-colors shrink-0"
      (click)="close()">
      <i class="ri-close-line text-xl sm:text-2xl"></i>
    </button>
  </div>

  <!-- Form Content -->
  <div class="flex-1 overflow-y-auto px-4 sm:px-6 py-4 sm:py-6 space-y-4 sm:space-y-6 support-scroll">
    <!-- Subject -->
    <div>
      <label class="block text-white font-semibold text-xs sm:text-sm mb-2">Subject</label>
      <input 
        type="text"
        [(ngModel)]="subject"
        class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-sm bg-[#002b47] border border-[#00243f] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-foxcode focus:border-transparent transition-all"
        placeholder="Enter subject">
    </div>

    <!-- Details -->
    <div>
      <label class="block text-white font-semibold text-xs sm:text-sm mb-2">Details</label>
      <textarea 
        [(ngModel)]="details"
        rows="4"
        class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-sm bg-[#002b47] border border-[#00243f] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-foxcode focus:border-transparent transition-all resize-none"
        placeholder="Describe the issue or feature request in detail"></textarea>
    </div>

    <!-- Priority -->
    <div>
      <label class="block text-white font-semibold text-xs sm:text-sm mb-2">Priority</label>
      <select 
        [(ngModel)]="priority"
        class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-sm bg-[#002b47] border border-[#00243f] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-foxcode focus:border-transparent transition-all appearance-none cursor-pointer">
        <option value="" disabled selected class="text-gray-500">Select priority</option>
        @for (p of priorities; track p) {
          <option [value]="p" class="bg-[#002b47]">{{ p }}</option>
        }
      </select>
    </div>

    <!-- Related Tool -->
    <div>
      <label class="block text-white font-semibold text-xs sm:text-sm mb-2">Related Tool</label>
      <select 
        [(ngModel)]="relatedTool"
        class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-sm bg-[#002b47] border border-[#00243f] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-foxcode focus:border-transparent transition-all appearance-none cursor-pointer">
        <option value="" disabled selected class="text-gray-500">Select tool</option>
        @for (tool of tools; track tool) {
          <option [value]="tool" class="bg-[#002b47]">{{ tool }}</option>
        }
      </select>
    </div>

    <!-- File Upload -->
    <div>
      <label class="block text-white font-semibold text-xs sm:text-sm mb-2">Attach files or screenshots</label>
      <div 
        class="border-2 border-dashed rounded-lg p-4 sm:p-8 text-center transition-colors"
        [class.border-gray-600]="!dragOver"
        [class.border-foxcode]="dragOver"
        [class.bg-foxcode/10]="dragOver"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)">
        <i class="ri-upload-cloud-2-line text-4xl sm:text-5xl text-gray-400 mb-2 sm:mb-3"></i>
        <p class="text-gray-300 text-xs sm:text-sm mb-1">Click or drag files here to upload</p>
        <p class="text-gray-500 text-[10px] sm:text-xs">Supported formats: images</p>
        <input 
          type="file"
          accept="image/*"
          multiple
          class="hidden"
          (change)="onFileSelect($event)"
          #fileInput>
        <button 
          type="button"
          class="mt-2 sm:mt-3 px-3 sm:px-4 py-1.5 sm:py-2 bg-foxcode hover:bg-foxcode-600 active:bg-foxcode-700 text-white rounded-lg text-xs sm:text-sm font-medium transition-colors"
          (click)="fileInput.click()">
          Select Files
        </button>
      </div>
    </div>

    <!-- Info Message -->
    <div class="bg-yellow-500/20 border border-yellow-500/30 rounded-lg p-3 sm:p-4">
      <p class="text-yellow-300 text-[10px] sm:text-xs flex items-start gap-1">
        <i class="ri-information-line mt-0.5 shrink-0"></i>
        <span>Your browser, operating system, and time of report will be sent automatically.</span>
      </p>
    </div>
  </div>

  <!-- Footer -->
  <div class="px-4 sm:px-6 py-3 sm:py-4 border-t border-[#00243f] bg-[#002b47] shrink-0">
    <button 
      type="button"
      class="w-full py-2.5 sm:py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-lg transition-colors text-sm sm:text-base"
      (click)="submitSupport()">
      Send Support Request
    </button>
  </div>
</div>
