<!-- Overlay -->
<div 
  class="fixed inset-0 bg-black/50 z-115 transition-opacity duration-300"
  [class.opacity-0]="!isVisible()"
  [class.opacity-100]="isVisible()"
  (click)="close()">
</div>

<!-- Sidebar -->
<div 
  class="fixed left-0 top-0 h-full w-65 bg-white dark:bg-[#1b1f28] shadow-2xl z-120 flex flex-col transition-transform duration-300 ease-out"
  [class.-translate-x-full]="!isVisible()"
  [class.translate-x-0]="isVisible()">
  
  <!-- Header -->
  <div class="flex items-center justify-between px-3 py-4 border-b border-[#f1f1f1] dark:border-[#424b60] shrink-0">
    <div class="flex items-center gap-x-2">
      <svg-icon-settings-dts fill="#246CE0" width="30" height="30"></svg-icon-settings-dts>
      <h1 class="font-bold text-nowrap whitespace-nowrap dark:text-white">
        Down Time Systems
      </h1>
    </div>

    <button 
      class="w-9 h-9 flex items-center justify-center rounded-lg border border-transparent hover:border-[#d7d7d7] dark:hover:border-[#353b43] hover:bg-[#f2f5fa] dark:hover:bg-[#181c24] text-black dark:text-[#d4d4d4] shrink-0"
      (click)="close()">
      <i class="ri-close-line text-2xl"></i>
    </button>
  </div>

  <!-- Navigation Content -->
  <div class="flex-1 overflow-y-auto">
    @if (isLoading()) {
      <div class="flex items-center justify-center py-8 h-full">
        <dts-loader></dts-loader>
      </div>
    } 
    @else if (filteredTools().length === 0) {
      <div class="px-6 py-8 text-[#334155] text-sm text-center">
        No tools available
      </div>
    } @else {
      <nav class="py-4 w-full">
          <div class="flex flex-col m-0 py-0 px-4 w-full">
            @for (menu of menus; track $index) {
              <span class="font-semibold text-[#64748b] dark:text-[#a2a4a5] text-xs uppercase tracking-wide mb-2">{{ menu.name }}</span>
              @for (item of menu?.menus; track $index) {
                <a (click)="close()" routerLinkActive="bg-dt-primary text-white hover:text-white dark:hover:text-white hover:bg-dt-primary dark:hover:bg-dt-primary" [routerLink]="item.route" class="mt-1 w-full py-2 pl-4 pr-2 rounded-md space-x-2 text-[#334155] dark:text-[#7e8a9a] 
                    hover:text-[#0054db] dark:hover:text-[#73a9ff] hover:bg-[#246ce02e] dark:hover:bg-[#0364ff36] hover:cursor-pointer 
                    transition-all duration-200 ease-in-out hover:translate-x-1 hover:shadow-sm active:scale-[0.98]">
                  <i class="ri-dashboard-2-line transition-transform duration-200"></i>
                  {{ item.name }}
                </a>
              }
              <p class="my-2 w-full h-px bg-[#f1f1f1] dark:bg-[#424b60] max-md:hidden"></p>
            }
          </div>
      </nav>
    }
  </div>

  <!-- Footer - Logout Button -->
  <div class="border-t border-[#f1f1f1] dark:border-[#424b60] p-4 shrink-0 flex items-center justify-center">
    <!-- Derechos reservados -->
    <p class="text-[9px] whitespace-nowrap text-nowrap text-[#404040] dark:text-[#d6d6d6]">&copy; 2024 DT Systems. Todos los derechos reservados.</p>
  </div>
</div>
