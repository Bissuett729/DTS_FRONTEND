<header class="bg-foxcode shadow-lg z-100 relative h-full">
    <div class="flex justify-between items-center h-full px-8 max-md:px-4">
        <!-- Left Section -->
        <div class="flex items-center gap-4 h-full">
            <button 
                class="hover:bg-white/10 active:bg-white/20 border-none rounded-lg p-2 cursor-pointer flex items-center justify-center text-white transition-all duration-200"
                (click)="toggleSidebar()">
                @if (sidebarCollapsed) {
                    <i class="ri-menu-line text-xl"></i>
                } @else {
                    <i class="ri-close-line text-xl"></i>
                }
            </button>
            
            <div class="h-8 w-px bg-white/20 max-md:hidden"></div>
            
            <button 
                type="button"
                title="Ir al Home"
                class="text-white text-sm font-bold m-0 tracking-[0.2em] px-3 py-1.5 rounded-md bg-[#00517e] shadow-sm uppercase hover:bg-[#06669e] active:bg-[#0a76b6] transition-colors"
                (click)="goHome()">
                {{ businessUnit }}
            </button>
        </div>

        <!-- Banner Section -->
        @if (showUATBanner) {
            <div class="hidden lg:flex items-center gap-2 px-4 py-2 bg-yellow-500/20 border border-yellow-500/40 rounded-lg animate-pulse">
                <i class="ri-alert-line text-yellow-400 text-lg"></i>
                <span class="text-yellow-300 text-xs font-medium">This page is under validation (UAT Environment)</span>
            </div>
        }

        <!-- Right Section -->
        <div class="flex items-center gap-3">
            <!-- Version Badge -->
            <div class="hidden md:flex items-center gap-2 px-3 py-1.5 bg-white/10 rounded-full">
                <i class="ri-code-box-line text-white/70 text-sm"></i>
                <span class="text-white/90 text-xs font-medium">v2.38.0</span>
            </div>

            <!-- Theme Toggle Button -->
            <button 
                title="Toggle theme"
                class="w-9 h-9 flex items-center cursor-pointer justify-center rounded-lg hover:bg-white/10 active:bg-white/20 text-white transition-all duration-200"
                (click)="toggleTheme()">
                <i class="ri-sun-line text-lg dark:hidden"></i>
                <i class="ri-moon-line text-lg hidden dark:block"></i>
            </button>

            <!-- Bug Report Button -->
            <button 
                title="Report a bug"
                class="w-9 h-9 flex items-center cursor-pointer justify-center rounded-lg hover:bg-white/10 active:bg-white/20 text-white transition-all duration-200"
                [class.bg-white/20]="supportSidebarOpen"
                (click)="toggleSupportSidebar()">
                <i class="ri-bug-line text-lg"></i>
            </button>

            <!-- Notifications Button -->
            <div class="relative">
                <button 
                    title="Notifications"
                    class="relative w-9 h-9 cursor-pointer flex items-center justify-center rounded-lg hover:bg-white/10 active:bg-white/20 text-white transition-all duration-200"
                    [class.bg-white/20]="notificationsOpen()"
                    (click)="toggleNotifications()">
                    <i class="ri-notification-2-line text-lg"></i>
                    @if (notifications.length > 0) {
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-foxcode"></span>
                    }
                </button>

                <!-- Notifications Dropdown -->
                @if (notificationsOpen()) {             
                    <foxcode-notifications-menu [notifications]="notifications" (onNotificationAction)="closeNotifications()"></foxcode-notifications-menu>
                }
            </div>

            <div class="h-8 w-px bg-white/20 max-md:hidden"></div>

            <!-- User Info -->
            @if (user) {
                <div class="flex items-center gap-3 max-md:hidden">
                    <div class="flex flex-col items-end text-white">
                        <div class="flex items-center gap-2">
                            <i class="ri-time-line text-xs text-white/70"></i>
                            <span class="font-semibold text-sm">{{ user?.clock }}</span>
                            <span class="text-white/50">•</span>
                            <span class="font-semibold text-sm">{{ user?.username }}</span>
                        </div>
                        @if (user?.email) {
                            <span class="text-xs text-white/70 mt-0.5">{{ user?.email }}</span>
                        }
                    </div>
                    
                    <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white font-semibold text-sm">
                        {{ user?.username?.charAt(0).toUpperCase() }}
                    </div>
                </div>
            }

            <!-- Logout Button -->
            <button 
                type="button"
                class="flex items-center cursor-pointer gap-2 px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 active:bg-white/30 text-white transition-all duration-200 font-medium text-sm"
                (click)="logout()">
                <i class="ri-logout-box-r-line text-base"></i>
                <span class="max-md:hidden">Logout</span>
            </button>
        </div>
    </div>
</header>
