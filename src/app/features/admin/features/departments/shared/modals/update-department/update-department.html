<foxcode-modal-layout
  title="Update Department"
  subtitle="Modify department information"
  icon="ri-user-settings-line"
  maxWidth="3xl"
  minWidth="6xl"
  (closeModal)="close()">

  <form modalContent [formGroup]="updateForm" class="px-2 py-4 space-y-4">
    <div class="space-y-4 p-5 bg-white dark:bg-[#1d2328] rounded-xl border border-gray-200 dark:border-[#2a3139] shadow-sm">
      <div class="flex items-center gap-2 mb-4">
        <div class="w-8 h-8 rounded-lg bg-foxcode/10 dark:bg-foxcode/25 flex items-center justify-center shadow-sm">
          <i class="ri-information-line text-foxcode dark:text-[#4f9eff]"></i>
        </div>
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
          Department Information
        </h3>
      </div>

      <div class="flex flex-col gap-y-6.5">
        <foxcode-input
          [control]="nameControl"
          label="Department Name"
          placeholder="Enter department name"
          icon="ri-text"
          [required]="true">
        </foxcode-input>
      </div>
    </div>
  </form>

  <div class="flex items-center gap-x-2" modalActions>
    <foxcode-button
      label="Cancel"
      variant="ghost"
      type="button"
      icon="ri-close-line"
      (click)="close()">
    </foxcode-button>
    
    <foxcode-button
      label="Update Department"
      type="submit"
      icon="ri-check-line"
      [loading]="submitting()"
      (click)="onSubmit()"
      [disabled]="updateForm.invalid || submitting()">
    </foxcode-button>
  </div>

</foxcode-modal-layout>
