<section class="h-full flex flex-col gap-4 overflow-x-hidden p-6 overflow-hidden newCustomMaterialStyle min-w-[50vw] max-w-[70vw] max-h-[90vh]">

    <button class="absolute right-px top-px p-1 rounded-full hover:bg-[#00000017] dark:hover:bg-[#ffffff21] outline-none" (click)="onNoClick()">
        <i class="ri-close-line"></i>
    </button>

    <section class="bg-[#4d4d4d] dark:bg-[#2c2c2c] shadow text-center text-white text-lg rounded-md px-4">
        <span class="text-base">{{receiveData.title}}</span>
    </section>
    
    
    <div class="w-full aspect-video overflow-hidden rounded-md">
        <img
            class="w-full h-full object-contain"
            [src]="receiveData.imgB64"
            alt="Imagen">
    </div>

</section>
