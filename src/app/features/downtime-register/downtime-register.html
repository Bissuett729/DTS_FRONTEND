<section class="w-full h-full flex flex-col gap-y-2 p-2">

    <dts-card>

        <div class="flex items-center justify-between">

            <div class="flex flex-col gap-1">
                <span class="text-3xl font-bold tracking-tight">Produccion y tiempo muerto por hora</span>
                <span class="text-[#737373] dark:text-[#d6d6d6]">Registrar las métricas diarias de los turnos y los datos de rendimiento técnico.</span>
            </div>

            <dts-button
                label="Guardar Registro"
                icon="ri-save-outline"
                (onClick)="registerDownTime()">
            </dts-button>

        </div>

    </dts-card>

    <dts-card>

        <div class="space-y-2">

            <div class="flex items-center gap-x-2">
                <i class="ri-information-2-fill text-[#246ce0]"></i>
                <h1 class="font-semibold text-lg">Informaci&oacute;n General</h1>
            </div>

            <div class="w-full flex justify-center">
                <span class="h-px w-[90%] bg-[#f1f1f1]"></span>
            </div>

            <form [formGroup]="downtimeForm" class="grid grid-cols-4 gap-2">

                <dts-date-picker
                    label="Fecha"
                    [control]="getDownTimeFormControl('date')"
                    hint="Selecciona una fecha"
                    >
                </dts-date-picker>

                <dts-input
                    label="Numero de Semana"
                    type="number"
                    [control]="getDownTimeFormControl('weekNumber')">
                </dts-input>


                <dts-select
                    label="Turno"
                    optionValue="value"
                    optionLabel="viewValue"
                    [control]="getDownTimeFormControl('shift')"
                    [options]="shifts">
                </dts-select>

                <dts-select
                    label="Línea"
                    optionValue="value"
                    optionLabel="viewValue"
                    [control]="getDownTimeFormControl('line')"
                    [options]="lines">
                </dts-select>

                <dts-time-picker
                    label="Hora de Inicio"
                    [control]="getDownTimeFormControl('startTime')">
                </dts-time-picker>

                <dts-time-picker
                    label="Hora de Fin"
                    [control]="getDownTimeFormControl('endTime')">
                </dts-time-picker>

                <dts-input
                    label="#Empleado del Supervisor"
                    class="col-span-2"
                    type="number"
                    [control]="getDownTimeFormControl('supervisor')">
                </dts-input>

            </form>

        </div>

    </dts-card>

    <section class="grid grid-cols-12 gap-2">

        <dts-card class="col-span-4">
            <div class="space-y-2">

                <div class="flex items-center gap-x-2">
                    <i class="ri-bar-chart-box-fill text-[#246ce0]"></i>
                    <h1 class="font-semibold text-lg">Metricas</h1>
                </div>

                <div class="w-full flex justify-center">
                    <span class="h-px w-[90%] bg-[#f1f1f1]"></span>
                </div>

                <form class="flex flex-col gap-y-4 px-6">

                    <dts-input
                        label="STD (Salida Esperada)"
                        [control]="getMetricsFormControl('standarOut')">
                    </dts-input>

                    <dts-input 
                        label="REAL (Salida Actual)"
                        [control]="getMetricsFormControl('actualOut')">
                    </dts-input>

                </form>

                <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-100 dark:border-slate-800 flex flex-col items-center">
                    <span class="text-xs uppercase font-bold tracking-widest opacity-60">Eficiencia</span>
                    <span class="text-3xl font-black text-[#246ce0]">84.2%</span>
                    <span class="text-[10px] mt-1 text-green-600 dark:text-green-400 font-bold flex items-center gap-1">
                        <i class="ri-line-chart-line text-sm"></i>
                        Auto-calculado
                    </span>
                </div>
            </div>
        </dts-card>

        <dts-card class="col-span-8">
            <div class="space-y-2">

                <div class="flex items-center gap-x-2">
                    <i class="ri-time-fill text-[#246ce0]"></i>
                    <h1 class="font-semibold text-lg">Clasificaci&oacute;n de tiempo muerto</h1>
                </div>

                <div class="w-full flex justify-center">
                    <span class="h-px w-[90%] bg-[#f1f1f1]"></span>
                </div>

                <form class="grid grid-cols-4 gap-2"></form>
            </div>
        </dts-card>

    </section>

</section>
