<section class="w-full h-full flex flex-col gap-y-8 p-4 overflow-hidden">
  <foxcode-card>
    <h1 class="text-2xl font-normal text-center dark:text-white">
      Welcome {{  userFullName() }} to FoxCode!
    </h1>
  </foxcode-card>

  <div class="grid grid-cols-12 gap-x-2 overflow-hidden w-full h-full">
    <div class="col-span-4 overflow-hidden px-0.5"></div>
    
    <div class="col-span-8 flex flex-col gap-y-2 overflow-hidden px-0.5">

      <foxcode-tab 
        [tabs]="TABS" 
        [selectedIndex]="activeTabIndex()"
        (selectedIndexChange)="activeTabIndex.set($event)">
      </foxcode-tab>

      <div class="h-[calc(100%-40px)] w-full overflow-hidden">
        @switch(activeTabIndex()) {
          @case(0) {
            <foxcode-support-report></foxcode-support-report>
          }
          @case(2) {
            <foxcode-developers></foxcode-developers>
          }
        }
      </div>
    </div>
  </div>
</section>
