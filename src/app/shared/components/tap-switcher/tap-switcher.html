<section
  class="relative flex items-center p-1 bg-slate-100 dark:bg-[#2a2a2e] border border-slate-200 dark:border-[#3f3f46] rounded-xl w-full"
  [ngStyle]="{ 'display': 'grid', 'grid-template-columns': 'repeat(' + tabs.length + ', 1fr)' }">

  <!-- Sliding indicator -->
  <div
    class="absolute top-1 bottom-1 left-1 rounded-lg bg-white dark:bg-[#3f3f46] shadow-sm border border-slate-200/80 dark:border-[#52525b] transition-transform duration-200 ease-out"
    [ngStyle]="{ width: 'calc(' + (100 / tabs.length) + '% - 4px)', transform: 'translateX(calc(' + (selectedIndex * 100) + '% + ' + (selectedIndex * 4) + 'px))' }">
  </div>

  <!-- Tabs -->
  @for (tab of tabs; track $index) {
    <button
      (click)="selectTab($index)"
      [class]="'relative z-10 flex items-center justify-center gap-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors duration-200 outline-none cursor-pointer ' + (tab?.customClass ?? '')"
      [ngClass]="{
        'text-slate-900 dark:text-white': selectedIndex === $index,
        'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300': selectedIndex !== $index
      }">
      @if (tab?.icon) {
        <i [class]="tab.icon + ' text-sm ' + tab?.iconClass"></i>
      }
      <span>{{ tab?.label }}</span>
    </button>
  }

</section>
