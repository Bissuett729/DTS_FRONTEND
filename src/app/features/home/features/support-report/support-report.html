<div class="w-full h-full flex flex-col gap-y-2 overflow-hidden">

    <foxcode-card class="w-full">
        <div class="flex items-center justify-center gap-x-3">
            <foxcode-input
                label="Filter"
                class="w-full"
                placeholder="Filter by title, code, tool, etc."
                [control]="filter">
            </foxcode-input>
    
            <foxcode-select
                label="Priority"
                [control]="priority" 
                [options]="priorityArr"
                optionLabel="view">
            </foxcode-select>
    
            <foxcode-select
                label="Status"
                [control]="status" 
                [options]="statusArr"
                optionLabel="view">
            </foxcode-select>
    
            <foxcode-button
                label="Filter"
                icon="ri-filter-line"
                [loading]="loadingData"
                [disabled]="filter.invalid && priority.invalid && status.invalid"
                (actionClicked)="loadReports()">
            </foxcode-button>
        </div>
    </foxcode-card>

    <div class="overflow-hidden h-full w-full">
        <foxcode-support-table class="overflow-hidden h-full w-full" [TableData]="signals.$clonReportsArr()"></foxcode-support-table>
    </div>

    <foxcode-card customClass="flex items-center justify-end">
        <foxcode-paginator
           [totalPages]="totalPages"
           (paginationChange)="loadReports($event)">
       </foxcode-paginator>
    </foxcode-card>
</div>
