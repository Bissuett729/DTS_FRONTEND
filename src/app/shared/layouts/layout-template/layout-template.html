@if (isLoadingPage()) {
  <foxcode-loader-page [message]="loaderMessage()"></foxcode-loader-page>
} @else {
  <div class="relative">
    <div class="grid grid-rows-[64px_1fr] h-screen overflow-hidden">
      
      <!-- Header -->
      <foxcode-header 
        class="col-span-2"
        [user]="user()"
        [supportSidebarOpen]="supportSidebarOpen()"
        [sidebarCollapsed]="sidebarCollapsed()"
        [isDarkMode]="isDarkMode()"
        [businessUnit]="businessUnit()"
        [showUATBanner]="showUATBanner()"
        (onToggleSidebar)="toggleSidebar()"
        (onToggleSupportSidebar)="toggleSupportSidebar()"
        (onToggleTheme)="toggleTheme()"
        (onLogout)="onLogout()">
      </foxcode-header>

      <!-- Main Content -->
      <main class="col-span-2 bg-[#f6f7f8] dark:bg-[#0f1418] overflow-y-auto w-full h-full">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>

  <!-- Route-change overlay (smoother than blank flash) -->
  @if (isRouting()) {
    <foxcode-loader-page [message]="'Cargando...'"></foxcode-loader-page>
  }

  <!-- Left Sidebar -->
  @if (!sidebarCollapsed()) {
    <foxcode-sidebar 
      [businessUnit]="businessUnit()"
      (onClose)="toggleSidebar()">
    </foxcode-sidebar>
  }

  <!-- Support Sidebar -->
  @if (supportSidebarOpen()) {
    <foxcode-support-sidebar (onClose)="closeSupportSidebar()"></foxcode-support-sidebar>
  }
}
