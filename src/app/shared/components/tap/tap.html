<section
  class="relative items-center p-1 border border-[#b9b9b9] dark:border-[#6b6b6b] bg-[#f5f5f5] dark:bg-[#424242] h-9 rounded-lg grid w-full outline-none"
  [ngStyle]="{ 'grid-template-columns': 'repeat(' + tabs.length + ', 1fr)' }">
  <div
    class="absolute top-1 left-1 h-7 rounded-md bg-white dark:bg-[#373737] border border-[#b7b7b7] dark:border-[#7f7f7f] transition-[transform] duration-300 ease-in-out outline-none"
    [ngStyle]="{ width: (100 / tabs.length) + '%', transform: 'translateX(' + (selectedIndex * 100) + '%)'}">
    </div>

    <!-- Botones -->
    @for (tab of tabs; track $index) {
      <button
        (click)="selectTab($index)"
        [class]="'relative z-10 rounded-md h-full flex items-center gap-x-2 justify-center outline-none ' + tab?.customClass"
        [ngClass]="{
          'text-black dark:text-white': selectedIndex === $index,
          'text-gray-500 dark:text-gray-300': selectedIndex !== $index
        }">
        @if (tab?.icon) {
          <i [class]="tab?.icon + '  ' + tab?.iconClass"></i>
        }
        {{ tab?.label }}
      </button>
    }
</section>
