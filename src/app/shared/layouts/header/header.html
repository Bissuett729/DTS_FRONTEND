<header class="bg-white dark:bg-[#27272a] shadow-sm z-100 relative h-full">
    <div class="flex justify-between items-center h-full px-8 max-md:px-4">
        <!-- Left Section -->
        <div class="flex items-center gap-4 h-full">
            <button 
                class="rounded-lg p-2 cursor-pointer flex items-center justify-center border border-transparent hover:border-[#d7d7d7] dark:hover:border-[#2f2f32] hover:bg-[#f2f5fa] dark:hover:bg-[#2b2b2b] text-dts-badges"
                (click)="toggleSidebar()">
                @if (sidebarCollapsed) {
                    <i class="ri-menu-line text-xl"></i>
                } @else {
                    <i class="ri-close-line text-xl"></i>
                }
            </button>
            
            <div class="h-8 w-px bg-[#f1f1f1] dark:bg-[#424b60] max-md:hidden"></div>

            <div class="flex items-center gap-x-2">
                <svg-icon-settings-dts fill="#246CE0" width="30" height="30"></svg-icon-settings-dts>
                <h1 class="font-bold text-dts-title text-nowrap whitespace-nowrap">
                    Down Time Systems
                </h1>
            </div>
            
            <!-- <button 
                type="button"
                title="Ir al Home"
                class="text-white text-xs font-medium m-0 tracking-[0.2em] px-3 py-2.5 rounded-md bg-[#006197] shadow-lg uppercase hover:bg-[#06669e] active:bg-[#0a76b6] transition-colors"
                (click)="goHome()">
                {{ businessUnit }}
            </button> -->
        </div>

        <!-- Banner Section -->
        @if (showUATBanner) {
            <div class="hidden lg:flex items-center gap-2 px-4 py-2 bg-yellow-500/20 border border-yellow-500/40 rounded-lg animate-pulse">
                <i class="ri-alert-line text-yellow-400 text-lg"></i>
                <span class="text-yellow-300 text-xs font-medium">This page is under validation (UAT Environment)</span>
            </div>
        }

        <!-- Right Section -->
        <div class="flex items-center gap-3">
            <!-- Version Badge -->
            <div class="hidden md:flex items-center gap-2 px-3 py-1.5 bg-[#fafafa] dark:bg-[#2b2b2b] border border-[#eeeeee] dark:border-[#2f2f32] rounded-md">
                <i class="ri-code-box-line text-dts-badges text-sm"></i>
                <span class="text-dts-badges text-xs font-medium">{{ appVersion() }}</span>
            </div>

            <!-- Theme Toggle Button -->
            <button 
                title="Toggle theme"
                class="w-9 h-9 flex items-center cursor-pointer justify-center rounded-lg border border-transparent hover:border-[#eeeeee] dark:hover:border-[#2f2f32] hover:bg-[#fafafa] dark:hover:bg-[#2b2b2b] text-dts-badges"
                (click)="toggleTheme()">
                <i class="ri-sun-line text-lg dark:hidden"></i>
                <i class="ri-moon-line text-lg hidden dark:block"></i>
            </button>

            <!-- Bug Report Button -->
            <!-- <button 
                title="Report a bug"
                class="w-9 h-9 flex items-center cursor-pointer justify-center rounded-lg border border-transparent hover:border-[#eeeeee] dark:hover:border-[#2f2f32] hover:bg-[#fafafa] dark:hover:bg-[#2b2b2b] text-dts-badges"
                [class.bg-white/20]="supportSidebarOpen"
                (click)="toggleSupportSidebar()">
                <i class="ri-bug-line text-lg"></i>
            </button> -->

            <!-- Notifications Button -->
            <div class="relative">
                <button 
                    title="Notifications"
                    class="relative w-9 h-9 flex items-center cursor-pointer justify-center rounded-lg border border-transparent hover:border-[#eeeeee] dark:hover:border-[#2f2f32] hover:bg-[#fafafa] dark:hover:bg-[#2b2b2b] text-dts-badges"
                    [class.bg-white/20]="notificationsOpen()"
                    (click)="toggleNotifications()">
                    <i class="ri-notification-2-line text-lg"></i>
                    @if (notifications.length > 0) {
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                    }
                </button>

                <!-- Notifications Dropdown -->
                @if (notificationsOpen()) {             
                    <foxcode-notifications-menu [notifications]="notifications" (onNotificationAction)="closeNotifications()"></foxcode-notifications-menu>
                }
            </div>

            <div class="h-8 w-px bg-[#f1f1f1] dark:bg-[#424b60] max-md:hidden"></div>

            <!-- User Info -->
            @if (user) {
                <div class="flex items-center gap-3 max-md:hidden">
                    <div class="flex flex-col items-end text-white">
                        <div class="flex items-center gap-2">
                            <i class="ri-time-line text-xs text-dts-badges"></i>
                            <span class="font-medium text-sm text-dts-badges">{{ user?.clock }}</span>
                            <span class="text-dts-badges">•</span>
                            <span class="font-medium text-sm text-dts-badges">{{ user?.username }}</span>
                        </div>
                        @if (user?.email) {
                            <span class="text-xs text-dts-badges mt-0.5">{{ user?.email }}</span>
                        }
                    </div>
                    
                    <div class="w-10 h-10 rounded-full bg-dt-primary flex items-center justify-center border dark:border-[#424b60] dark:bg-[#00000038] text-white font-semibold text-sm">
                        {{ user?.username?.charAt(0).toUpperCase() }}
                    </div>
                </div>
            }
            
            <div class="h-8 w-px bg-[#f1f1f1] dark:bg-[#424b60] max-md:hidden"></div>

            <!-- Logout Button -->
            <button 
                type="button"
                class="flex items-center cursor-pointer gap-2 px-3 py-2 bg-[#f1f5f9] dark:bg-[#0000001a] dark:hover:bg-[#9c9c9c2b] border border-[#e2e2e2] dark:border-[#353b43] rounded-md font-medium text-sm"
                (click)="logout()">
                <i class="ri-logout-box-r-line text-base text-[#334155] dark:text-[#aab3be]"></i>
                <span class="max-md:hidden text-[#334155] dark:text-[#aab3be]">Logout</span>
            </button>
        </div>
    </div>
</header>
