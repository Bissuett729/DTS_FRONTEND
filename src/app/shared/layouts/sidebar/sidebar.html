<!-- Overlay -->
<div 
  class="fixed inset-0 bg-black/50 z-115 transition-opacity duration-300"
  [class.opacity-0]="!isVisible()"
  [class.opacity-100]="isVisible()"
  (click)="close()">
</div>

<!-- Sidebar -->
<div 
  class="fixed left-0 top-0 h-full w-65 bg-[#003d65] shadow-2xl z-120 flex flex-col transition-transform duration-300 ease-out"
  [class.-translate-x-full]="!isVisible()"
  [class.translate-x-0]="isVisible()">
  
  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-white/15 shrink-0">
    <h2 class="text-white font-bold text-sm tracking-wide uppercase">{{ businessUnit }} TOOLS</h2>
    <button 
      class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-white/10 active:bg-white/20 text-white transition-colors shrink-0"
      (click)="close()">
      <i class="ri-close-line text-2xl"></i>
    </button>
  </div>

  <!-- Navigation Content -->
  <div class="flex-1 overflow-y-auto">
    @if (isLoading()) {
      <div class="flex items-center justify-center py-8">
        <i class="ri-loader-4-line text-white text-2xl animate-spin"></i>
      </div>
    } @else if (filteredTools().length === 0) {
      <div class="px-6 py-8 text-white/60 text-sm text-center">
        No tools available
      </div>
    } @else {
      <nav class="py-4">
          <ul class="list-none m-0 p-0">
              @for (tool of filteredTools(); track tool._id) {
                <li class="my-1">
                    <a [href]="tool.link" 
                        class="flex items-center gap-4 px-6 py-3.5 text-white/80 no-underline transition-all duration-200 relative hover:bg-white/10 hover:text-white before:content-[''] before:absolute before:left-0 before:top-0 before:h-full before:w-1 before:bg-foxcode-300 before:scale-y-0 before:transition-transform before:duration-200 hover:before:scale-y-100">
                        <i class="ri-tools-line text-lg shrink-0"></i>
                        <span class="text-sm font-medium whitespace-nowrap">{{ tool.title }}</span>
                    </a>
                </li>
              }
          </ul>
      </nav>
    }
  </div>
</div>
