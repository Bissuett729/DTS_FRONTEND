<section class="w-full flex flex-col gap-4 p-4 h-full overflow-hidden">

  <foxcode-card>
    <h1 class="text-center uppercase text-2xl font-bold tracking-widest">Development Testing Engineering Team</h1>
    <p class="text-center text-gray-500 dark:text-gray-400 text-base">Meet the minds behind the code</p>
  </foxcode-card>

  <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2 overflow-y-auto">
      @for (person of people; track $index) {    
        <foxcode-card class="col-span-1 row-span-1 transition-transform duration-200 hover:scale-[1.03] shadow-md group bg-white/80 dark:bg-[#23272f]/80">
          <div class="flex justify-between items-center gap-4 h-full w-full">
      
            <!-- LEFT CONTENT -->
            <div class="flex flex-col gap-1">
              <span class="text-lg font-semibold">
                {{ person.name }}
              </span>
      
              <span class="text-sm text-gray-600 dark:text-gray-400">
                {{ person.position }} • {{ person.role }}
              </span>
      
              <span
                (click)="copyToClipboard(person.mail)"
                [matTooltip]="person.mail"
                matTooltipPosition="above"
                class="text-sm text-blue-600 dark:text-blue-400 cursor-pointer hover:underline w-fit">
                {{ person.mail }}
              </span>
      
              <span class="text-xs text-gray-500">
                Shift: {{ person.shift }}
              </span>
            </div>
      
            <!-- RIGHT IMAGE -->
            <div class="shrink-0">
              <img
                [src]="person.imageUrl"
                alt="{{ person.name }}"
                class="w-20 h-20 rounded-full object-cover border-2 border-gray-300 dark:border-gray-600"/>
            </div>
      
          </div>
        </foxcode-card>
      }
  </section>

</section>
