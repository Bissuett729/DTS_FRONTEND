<section class="w-full h-full flex flex-col gap-y-2">

    <foxcode-card>
        <div class="dark:border-gray-700 flex items-center justify-between">
            <div>
                <h2 class="text-3xl font-semibold tracking-tight text-black dark:text-white">
                    Departments Management
                </h2>
                <p class="text-[#737373] dark:text-[#d6d6d6]">
                    Manage system departments and configurations.
                </p>
            </div>

            <div class="flex items-center gap-x-2">
                <foxcode-input
                    icon="ri-search-2-line"
                    placeholder="Search by department name"
                    [control]="searchControl">
                </foxcode-input>
    
                <foxcode-button 
                    label="Search" 
                    [disabled]="searchControlValue === ''" 
                    [loading]="loading()">
                </foxcode-button>

                <foxcode-button 
                    label="Reset" 
                    variant="ghost">
                </foxcode-button>
            </div>

            <foxcode-button
                label="New Department"
                icon="ri-add-line"
                (click)="openCreateModal()">
            </foxcode-button>
        </div>
    </foxcode-card>

    <!-- Loading State -->
    @if (loading()) {
        <div class="flex-1 flex items-center justify-center bg-gray-50 dark:bg-[#181c20]">
            <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-solid border-foxcode border-r-transparent"></div>
            <p class="mt-4 text-gray-600 dark:text-gray-400">Loading tools...</p>
            </div>
        </div>
    }

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        @for (department of departments(); track department._id) {
            <div class="group relative bg-gray-50 dark:bg-[#424242] shadow-md rounded-xl border border-gray-200 dark:border-[#727272] hover:border-foxcode dark:hover:border-[#a9a9a9] hover:shadow-lg cursor-pointer"
                (click)="openUpdateModal(department)">
                <!-- Active Status Badge -->
                <div class="absolute top-3 right-3 z-10">
                    @if (department.active) {
                        <span class="px-2 py-1 rounded-md text-xs font-semibold bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 flex items-center gap-1">
                            <i class="ri-checkbox-circle-fill"></i>
                            Active
                        </span>
                    } 
                    @else {
                        <span class="px-2 py-1 rounded-md text-xs font-semibold bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400 flex items-center gap-1">
                            <i class="ri-close-circle-fill"></i>
                            Inactive
                        </span>
                    }
                </div>
                <div class="p-5">
                    <!-- Tool Icon and Title -->
                    <div class="flex items-start gap-3 mb-3">
                        <div class="w-12 h-12 rounded-xl bg-foxcode/10 dark:bg-foxcode/25 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform duration-200">
                            <i class="ri-building-line text-2xl text-foxcode dark:text-[#4f9eff]"></i>
                        </div>
                        <div class="flex-1 min-w-0 pt-2">
                            <h3 class="text-base font-bold text-gray-900 dark:text-white truncate group-hover:text-foxcode dark:group-hover:text-[#4f9eff]">
                                {{ department.name }}
                            </h3>
                        </div>
                    </div>
                    <!-- Edit Indicator -->
                    <div class="mt-4 pt-3 border-t border-gray-200 dark:border-[#2a3139]">
                        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
                            <span>Click to edit</span>
                            <i class="ri-arrow-right-line group-hover:translate-x-1 transition-transform duration-200"></i>
                        </div>
                    </div>
                </div>
            </div>
        }
    </div>
</section>
