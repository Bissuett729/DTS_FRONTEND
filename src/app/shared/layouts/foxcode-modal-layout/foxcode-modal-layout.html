<div class="w-full rounded-md h-[90vh] max-h-[90vh] flex flex-col overflow-hidden p-2 dark:bg-[#15191c]" 
     [ngClass]="maxWidthClass + ' ' + minWidthClass">

    <!-- Header with gradient background - Fixed -->
    <div class="bg-linear-to-r from-foxcode to-blue-600 px-6 py-5" style="flex-shrink: 0;">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <!-- Icon -->
          <div class="w-12 h-12 rounded-lg bg-white/20 backdrop-blur-sm flex items-center justify-center">
            <i [class]="icon + ' text-2xl text-white'"></i>
          </div>
          
          <!-- Title & Subtitle -->
          <div>
            <h2 class="text-2xl font-bold text-white">
              {{ title }}
            </h2>
            @if (subtitle) {
              <p class="text-sm text-white/80 mt-0.5">
                {{ subtitle }}
              </p>
            }
          </div>
        </div>
        
        <!-- Close Button -->
        <button
          type="button"
          (click)="onClose()"
          class="w-10 h-10 rounded-lg bg-white/10 hover:bg-white/20 backdrop-blur-sm flex items-center justify-center text-white transition-all duration-200 hover:scale-105">
          <i class="ri-close-line text-xl"></i>
        </button>
      </div>
    </div>

    <!-- Content - Scrollable -->
    <section class="flex flex-col flex-1 min-h-0 overflow-y-auto">
        @if (loading) {
          <div class="flex items-center justify-center py-16" style="flex: 1;">
            <div class="text-center">
              <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-foxcode"></div>
              <p class="mt-4 text-gray-600 dark:text-gray-400">{{ loadingMessage }}</p>
            </div>
          </div>
        } @else {
          <!-- Projected Content -->
          <ng-content select="[modalContent]"></ng-content>
        }
    </section>
    
    <!-- Action Buttons - Fixed at bottom -->
    <div class="px-6 py-4 border-t border-gray-200 dark:border-[#2a3139] bg-white dark:bg-[#1d2328]" style="flex-shrink: 0;">
        <div class="flex items-center justify-end gap-3">
          <!-- Projected Actions -->
          <ng-content select="[modalActions]"></ng-content>
        </div>
    </div>

</div>
